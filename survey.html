<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ankieta G4</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="card">
    <h1>Ankieta kwalifikacyjna G4</h1>
    <p class="subtitle">Odpowiedz na poniższe pytania. Ankietę można wypełnić tylko raz.</p>

    <div id="questionsContainer"></div>
    <div id="message"></div>
    <button id="submitBtn">Wyślij odpowiedzi</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const messageEl = document.getElementById('message');
    const container = document.getElementById('questionsContainer');
    const answers = {};

    function showMsg(text, type) {
      messageEl.innerHTML = `<div class="msg ${type}">${text}</div>`;
    }

    if (!code) {
      showMsg('Brak kodu dostępu. Wróć do strony głównej.', 'error');
      document.getElementById('submitBtn').disabled = true;
    } else {
      init();
    }

    async function init() {
      const { data: checkData, error: checkErr } = await sb.rpc('check_code', { code_val: code });
      if (checkErr || !checkData || !checkData.valid) {
        if (checkData && checkData.reason === 'used') {
          showMsg(`Ten kod został już wykorzystany. <a href="/status.html?code=${encodeURIComponent(code)}">Sprawdź status swojego zgłoszenia</a>.`, 'info');
        } else if (checkData && checkData.reason === 'expired') {
          showMsg('Ten kod wygasł (ważność: 5 dni od wydania). Poproś o nowy kod dostępu.', 'error');
        } else {
          showMsg('Ten kod jest nieprawidłowy.', 'error');
        }
        document.getElementById('submitBtn').disabled = true;
        return;
      }

      const { data: questions, error: qErr } = await sb
        .from('g4_questions')
        .select('*')
        .order('order_num', { ascending: true });

      if (qErr) {
        showMsg('Błąd wczytywania pytań.', 'error');
        return;
      }
      renderQuestions(questions);
    }

    function renderQuestions(questions) {
      container.innerHTML = '';
      questions.forEach(q => {
        const block = document.createElement('div');
        block.className = 'q-block';
        const title = document.createElement('div');
        title.className = 'q-text';
        title.textContent = q.text;
        block.appendChild(title);

        if (q.type === 'yesno') {
          const row = document.createElement('div');
          row.className = 'yesno-row';
          const yesBtn = document.createElement('button');
          yesBtn.textContent = 'Tak';
          yesBtn.type = 'button';
          yesBtn.className = 'yes';
          const noBtn = document.createElement('button');
          noBtn.textContent = 'Nie';
          noBtn.type = 'button';
          noBtn.className = 'no';
          yesBtn.addEventListener('click', () => {
            answers[q.id] = true;
            yesBtn.classList.add('active'); noBtn.classList.remove('active');
          });
          noBtn.addEventListener('click', () => {
            answers[q.id] = false;
            noBtn.classList.add('active'); yesBtn.classList.remove('active');
          });
          row.appendChild(yesBtn); row.appendChild(noBtn);
          block.appendChild(row);
        } else if (q.type === 'scale') {
          const input = document.createElement('input');
          input.type = 'number';
          input.min = q.min; input.max = q.max;
          input.placeholder = `${q.min} - ${q.max}`;
          input.addEventListener('input', () => { answers[q.id] = Number(input.value); });
          block.appendChild(input);
        } else if (q.type === 'choice') {
          const row = document.createElement('div');
          row.className = 'choice-row';
          (q.options || []).forEach((opt) => {
            const label = document.createElement('label');
            label.className = 'choice-opt';
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = q.id;
            radio.value = opt.label;
            radio.addEventListener('change', () => {
              answers[q.id] = opt.label;
              row.querySelectorAll('.choice-opt').forEach(el => el.classList.remove('selected'));
              label.classList.add('selected');
            });
            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt.label));
            row.appendChild(label);
          });
          block.appendChild(row);
        } else if (q.type === 'text') {
          const textarea = document.createElement('textarea');
          textarea.addEventListener('input', () => { answers[q.id] = textarea.value; });
          block.appendChild(textarea);
        }

        container.appendChild(block);
      });
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Wysyłanie...';
      try {
        const { data, error } = await sb.rpc('submit_answers', {
          code_val: code,
          answers_val: answers
        });
        if (!error && data && data.success) {
          window.location.href = `/status.html?code=${encodeURIComponent(code)}`;
        } else {
          showMsg((data && data.error) || 'Wystąpił błąd.', 'error');
          btn.disabled = false;
          btn.textContent = 'Wyślij odpowiedzi';
        }
      } catch (e) {
        showMsg('Błąd połączenia z serwerem.', 'error');
        btn.disabled = false;
        btn.textContent = 'Wyślij odpowiedzi';
      }
    });
  </script>
</body>
</html>
